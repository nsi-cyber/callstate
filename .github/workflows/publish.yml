name: Publish
on:
  release:
    types: [released, prereleased]
  workflow_dispatch:

jobs:
  publish:
    name: Release build and publish
    runs-on: macOS-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Import GPG signing key
        env:
          GPG_KEY_CONTENTS: ${{ secrets.GPG_KEY_CONTENTS }}
          GPG_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_KEY_CONTENTS:-}" ]; then
            echo "GPG_KEY_CONTENTS secret is missing."
            exit 1
          fi

          KEY_FILE="${RUNNER_TEMP}/signing.key"
          RAW_FILE="${RUNNER_TEMP}/signing.raw"
          printf '%s' "$GPG_KEY_CONTENTS" > "$RAW_FILE"

          if grep -q 'BEGIN PGP PRIVATE KEY BLOCK' "$RAW_FILE"; then
            echo "Detected armored PGP key in secret."
            cp "$RAW_FILE" "$KEY_FILE"
          else
            echo "Trying base64 decode (recommended GitHub Secret format)."
            base64 -D < "$RAW_FILE" > "$KEY_FILE"
          fi

          if ! gpg --batch --list-packets "$KEY_FILE" >/dev/null 2>&1; then
            echo "::error::GPG_KEY_CONTENTS is not valid OpenPGP data."
            echo "Update the secret using: gpg --armor --export-secret-keys KEY_ID | base64 | pbcopy"
            echo "Then paste into GitHub secret GPG_KEY_CONTENTS (single line base64)."
            exit 1
          fi

          gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --import "$KEY_FILE"
          echo "Imported secret keys:"
          gpg --list-secret-keys --keyid-format LONG
      - name: Publish to MavenCentral
        run: |
          ./gradlew publishToMavenCentral --no-configuration-cache \
            -Psigning.gnupg.keyName="${{ secrets.SIGNING_KEY_ID }}" \
            -Psigning.gnupg.passphrase="${{ secrets.SIGNING_PASSWORD }}"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
