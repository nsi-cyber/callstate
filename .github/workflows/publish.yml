name: Publish
on:
  release:
    types: [released, prereleased]
  workflow_dispatch:

jobs:
  publish:
    name: Release build and publish
    runs-on: macOS-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Prepare in-memory PGP key for Gradle
        env:
          GPG_KEY_CONTENTS: ${{ secrets.GPG_KEY_CONTENTS }}
        run: |
          # Vanniktech expects a single line: armor body only (no BEGIN/END, no checksum line).
          # See https://github.com/vanniktech/gradle-maven-publish-plugin/issues/1122
          NORMALIZED="$(printf '%s' "$GPG_KEY_CONTENTS" | grep -v '\-\-' | grep -v '^=.' | tr -d '\n')"
          if [ -z "$NORMALIZED" ]; then
            echo "GPG_KEY_CONTENTS secret is empty or invalid."
            exit 1
          fi
          echo "ORG_GRADLE_PROJECT_signingInMemoryKey=$NORMALIZED" >> "$GITHUB_ENV"
      - name: Publish to MavenCentral
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
