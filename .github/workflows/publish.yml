name: Publish
on:
  release:
    types: [released, prereleased]
  workflow_dispatch:

jobs:
  publish:
    name: Release build and publish
    runs-on: macOS-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Import GPG signing key
        env:
          GPG_KEY_CONTENTS: ${{ secrets.GPG_KEY_CONTENTS }}
          GPG_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$GPG_KEY_CONTENTS" ]; then
            echo "GPG_KEY_CONTENTS secret is missing."
            exit 1
          fi
          printf '%s' "$GPG_KEY_CONTENTS" | gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --import
          echo "Imported secret keys:"
          gpg --list-secret-keys --keyid-format LONG
      - name: Publish to MavenCentral
        run: |
          ./gradlew publishToMavenCentral --no-configuration-cache \
            -Psigning.gnupg.keyName="${{ secrets.SIGNING_KEY_ID }}" \
            -Psigning.gnupg.passphrase="${{ secrets.SIGNING_PASSWORD }}"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
